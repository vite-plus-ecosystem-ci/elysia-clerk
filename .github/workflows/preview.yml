name: Preview

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp pack

      # Ecosystem-ci smoke test: publishing a preview package needs a GitHub App or
      # token the fork does not have, and it does not exercise the pinned Vite+.
      - name: Create a snapshot version
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        id: snapshot
        run: vp dlx pkg-pr-new publish --compact
